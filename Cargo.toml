[package]
name = "stage-safety-gateway"
version = "2.2.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Stage-safety sensor gateway for Musikfestapp (Broadweigh/Mantracourt)"
repository = "https://github.com/musikfestwochen/stage-safety-gateway"
homepage = "https://github.com/musikfestwochen/stage-safety-gateway"
readme = "README.md"
keywords = ["broadweigh", "mantracourt", "t24", "serial", "gateway"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["art/", "docs/", ".github/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
env_logger = "0.11.8"
inquire = "0.9.4"
log = "0.4.27"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4.9", default-features = false }
tempfile = "3.27.0"
toml = "1.1.3"

[dev-dependencies]
httpmock = { version = "0.8.3", default-features = false }
serde_json = "1.0"
